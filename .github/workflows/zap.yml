# OWASP ZAP reads the live site once a week. It reports weak headers and other things that it can see without an attack.
name: ZAP baseline

on:
  schedule:
    - cron: '9 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  zap:
    name: Passive scan of the live site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The rules file tells ZAP which findings are decisions of the project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://fajnovka.zezulka.me
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
