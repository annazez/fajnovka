# A pull request of Dependabot with patch and minor versions merges itself when all required checks pass.
name: Dependabot auto-merge

on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Turn on auto-merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # The merge writes to the main branch.
      pull-requests: write # The job turns on auto-merge for the pull request.
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # The job only turns on the auto-merge of GitHub. GitHub merges when the required checks of the branch rule pass.
      # Without such a rule, GitHub refuses the request, and the pull request waits for a person.
      - name: Merge patch and minor versions when the required checks pass
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.node_id }}
          QUERY: |
            mutation ($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                clientMutationId
              }
            }
        run: gh api graphql -f id="$PULL_REQUEST" -f query="$QUERY"
