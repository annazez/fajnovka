# The security gates of the project. `security-ok` is the one check that a branch rule needs: it passes only if all jobs pass.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Each Monday morning: a new advisory can arrive without a change of the code.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # CodeQL sends its findings to the Security tab of the repository.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  osv:
    name: Known vulnerabilities (OSV)
    permissions:
      actions: read # OSV-Scanner reads the data of its own run when it sends the findings.
      contents: read
      security-events: write # OSV-Scanner sends its findings to the Security tab of the repository.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-24.04
      scan-args: |-
        --lockfile=./package-lock.json

  dependency-review:
    name: New dependencies
    # A pull request is the only event that has a list of new dependencies.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: pipx install semgrep==1.185.0
      - name: Search the code for risky patterns
        run: >
          semgrep scan --error --metrics=off --disable-version-check --config p/default --config p/javascript --config p/typescript --config p/secrets --config p/github-actions

  workflows:
    name: Workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          pipx install actionlint-py==1.7.12.25
          actionlint
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          persona: pedantic
          # A finding stops this job. It does not go to the Security tab.
          advanced-security: false

  sbom:
    name: List of software parts (SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Write the list in the CycloneDX format
        run: npm sbom --package-lock-only --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  security-ok:
    name: security-ok
    if: ${{ always() }}
    needs: [codeql, osv, dependency-review, semgrep, workflows, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          ALWAYS: >-
            ${{ needs.codeql.result }} ${{ needs.osv.result }} ${{ needs.semgrep.result }} ${{ needs.workflows.result }} ${{ needs.sbom.result }}
          ON_PULL_REQUEST: ${{ needs.dependency-review.result }}
        run: |
          echo "Results: $ALWAYS, and for a pull request: $ON_PULL_REQUEST"
          for result in $ALWAYS; do
            [ "$result" = "success" ] || exit 1
          done
          [ "$ON_PULL_REQUEST" = "success" ] || [ "$ON_PULL_REQUEST" = "skipped" ] || exit 1
